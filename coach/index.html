<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Login</title>

    <link href="//cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />

    <style>
      body {
        font-family: arial, sans-serif;
        overflow: hidden;
      }

      .hidden {
        display: none;
      }

      fieldset {
        /* padding-top: 0.5em; */
        padding: 1em 1em 1.5em;
        margin-bottom: 1.5em;
        border: 2px solid #afafaf;
        border-radius: 3px;
      }

      legend {
        background: #f4f0f0;
        padding: 0.3em 0.5em;
        border: 2px solid #c2c2c2;
        color: gray;
        font-weight: bold;
        font-size: 0.9em;
      }

      .login {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background: gray;
        padding: 0;
        margin: 0;
        overflow: auto;
      }

      .login h1 {
        color: gray;
        text-align: center;
        margin: 0 auto 30px;
      }

      .login-container {
        background: white;
        /*color: gray;*/
        border-radius: 3px;
        width: 500px;
        /*height: 400px;*/
        /* margin: 10% auto 0; */
        margin: 2em auto;
        /* padding: 40px 30px; */
        padding: 3em;

        /* text-align: center; */

        display: flex;
        flex-flow: column;
        justify-content: center;
        align-items: center;

      }

      /* span[title="Select a district..."],
      span[title="Select a facility..."] {
        color: darkgray !important;
        font-weight: normal !important;
      } */

      .login-container input[type="text"],
      .login-container input[type="email"],
      .login-container select {
        /* width: 80%; */
        color: #2ba6cb;
        font-size: 1.1em;
        font-weight: bold;
        margin-bottom: 20px;
        padding: 6px 8px;
        box-shadow: none;
        border-radius: 3px;
        border: 2px solid lightgray;

        /* display: block; */
      }

      .select2-container--default .select2-selection--single {
        border-radius: 3px;
        border: 2px solid lightgray;
        height: 36px;
      }


      .select2-container--default .select2-selection--single .select2-selection__rendered {
        color: #2ba6cb;
        font-size: 1.1em;
        font-weight: bold;
        line-height: 32px;
      }

      .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 34px;
      }

      .select2-container--default .select2-selection--single .select2-selection__placeholder {
        color: rgba(0, 0, 0, 0.3);
        font-weight: normal;
        font-style: italic;
      }

      .login-container>input {
        width: calc(100% - 2em);
      }

      .select2-container {
        width: 100% !important;
      }

      .login-container select {
        width: 100%;
      }

      .form-block-wrapper {
        /* display: inline-block; */
        text-align: left;
        width: 100%;
      }

      .form-block-wrapper label {
        display: block;
        margin: 0 0 0.5em;
        color: dimgrey;
        cursor: pointer;
        padding: 0.2em;
      }

      .form-block-wrapper label:hover {
        background: rgba(43, 166, 203, 0.18);
      }

      ::placeholder {
        color: rgba(0, 0, 0, 0.3);
        font-style: italic;
        font-weight: normal;
      }

      ::-webkit-input-placeholder {
        color: rgba(0, 0, 0, 0.3);
        font-style: italic;
        font-weight: normal;
      }

      :-moz-placeholder,
      ::-moz-placeholder {
        color: rgba(0, 0, 0, 0.3);
        font-style: italic;
        font-weight: normal;
      }

      :-ms-input-placeholder {
        color: rgba(0, 0, 0, 0.3) !important;
        font-style: italic;
        font-weight: normal !important;
      }

      ::-ms-input-placeholder {
        color: rgba(0, 0, 0, 0.3);
        font-style: italic;
        font-weight: normal;
      }

      :placeholder-shown {
        color: rgba(0, 0, 0, 0.3);
        font-style: italic;
        font-weight: normal;
      }

      .radio-block {
        margin-top: 1em;
        margin-bottom: -0.5em;
      }

      .radio-block-label {
        color: rgb(80, 80, 80);
        font-weight: bold;
        margin-bottom: 0.5em;
      }

      button {
        padding: 0.6em 0.8em;
        margin-top: 10px;
        font-size: 1.4em;
        background: #2ba6cb;
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
      }

      button:hover {
        background: #247b95;
      }

      #login-button:disabled {
        background: lightgray;
        cursor: default;
      }

      .login-alerts-container #login-alerts {
        color: red;
        margin: 2em 4em 0;
      }

      .environment-type-sandbox {
        position: fixed;
        bottom: 0;
        left: 0;
        padding: 1em;
        background: darkred;
        color: white;
        text-transform: uppercase;
        font-weight: bold;
        font-size: 0.8em;
        opacity: 0.5;
      }
    </style>

  </head>

  <body>

    <form action="javascript:app.loginUser()" id="login-form" class="login hidden">
      <div class="login-container">
        <h1 id="course-name">Login</h1>

        <input type="text" id="login-name" name="login-name" placeholder="Name" required />
        <input type="email" id="login-email" name="login-email" placeholder="Email Address" required />

        <div id="login-district" class="form-block-wrapper">
          <fieldset>
            <legend>District</legend>

            <div class="form-block-wrapper">
              <select name="login-district" id="district-list" class="selectBox select2-district" form="login-form">
                <option></option>
              </select>
            </div>

            <div class="radio-block login-district-level hidden">
              <div class="radio-block-label">I work at a district level:</div>

              <label>
                <input type="radio" form="login-form" id="login-district-level-true" class="radio-btn"
                  name="login-district-level-boolean" value="true" />
                <span>
                  Yes
                </span>
              </label>

              <label>
                <input type="radio" form="login-form" id="login-district-level-false" class="radio-btn"
                  name="login-district-level-boolean" value="false" />
                <span>
                  No
                </span>
              </label>
            </div>

          </fieldset>
        </div>

        <div id="login-facility" class="form-block-wrapper login-facility-wrapper hidden">
          <fieldset>
            <legend>School / Facility</legend>

            <div class="form-block-wrapper">
              <select name="login-facility" id="facility-list" class="selectBox select2-facility" form="login-form">
                <option></option>
              </select>
            </div>

            <div class="radio-block login-mtss hidden">
              <div class="radio-block-label">I am on my school’s SLT:</div>

              <label>
                <input type="radio" form="login-form" id="login-mtss-true" class="radio-btn" name="login-mtss-boolean"
                  value="true" />
                <span>
                  Yes
                </span>
              </label>

              <label>
                <input type="radio" form="login-form" id="login-mtss-false" class="radio-btn" name="login-mtss-boolean"
                  value="false" />
                <span>
                  No
                </span>
              </label>
            </div>

          </fieldset>
        </div>

        <div>
          <button type="submit" id="login-button" disabled>Login</button>
          <button type="reset" class="reset-form hidden" id="reset-button">Reset</button>
        </div>
        <div class="login-alerts-container">
          <div id="login-alerts" class="hidden"></div>
        </div>
      </div>
    </form>

    <div class="environment-type-sandbox hidden">
      <div>Sandbox</div>
    </div>

    <script src="//code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
      crossorigin="anonymous"></script>

    <script src="//cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>

    <script src="index.js"></script>

  </body>

</html>
